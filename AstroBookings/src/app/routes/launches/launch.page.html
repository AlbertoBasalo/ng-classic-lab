<app-async-block [source$]="launch$" [template]="launchTemplate">
  <ng-template #launchTemplate let-launch>
    <pre>Agency: {{ agency$ | async | json }}</pre>
    <pre>Rocket and Bookings: {{ rocketAndBookings$ | async | json }}</pre>
    <pre>Available Seats: {{ availableSeats$ | async }}</pre>
    <pre>PassengersIds: {{ passengersId$ | async | json }}</pre>
    <div *ngFor="let passenger of passengers">
      <pre>{{ passenger | json }}</pre>
    </div>
    <h1>{{ launch.mission}}</h1>
    <app-launch-details [launch]="launch"></app-launch-details>
    <app-bookings-form [launch]="launch"></app-bookings-form>
  </ng-template>
</app-async-block>
