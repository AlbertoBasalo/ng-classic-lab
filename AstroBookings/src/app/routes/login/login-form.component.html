<form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
  <div>
    <label for="email">Email:</label>
    <input type="email" id="email" formControlName="email" [attr.aria-invalid]="email.invalid" />
    <small *ngIf="email.invalid">{{ email.errors | json }}</small>
  </div>
  <div>
    <label for="password">Password:</label>
    <input
      type="password"
      id="password"
      formControlName="password"
      [attr.aria-invalid]="password.invalid"
    />
    <small *ngIf="password.invalid">{{ password.errors | json }}</small>
  </div>
  <button type="submit" [disabled]="loginForm.invalid">Login</button>
</form>
